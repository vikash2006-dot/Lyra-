[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra"
version = "0.1.0"
description = "LYRA — A modular Personal AI Operating System"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "LYRA Team" }
]
dependencies = [
    "sounddevice>=0.5.0",
    "SpeechRecognition>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
lyra = "lyra.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lyra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
